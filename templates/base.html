<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titel}}</title>
<meta name="description" content="{{beschrijving}}">
<link rel="canonical" href="https://{{site.domein}}{{url}}">
<meta property="og:title" content="{{titel}}">
<meta property="og:description" content="{{beschrijving}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="nl_NL">
<meta property="og:site_name" content="{{site.naam}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
{{{schema}}}
</head>
<body class="{{klasse}}">

<a class="skip" href="#hoofd">Naar de inhoud</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="/">
      <img src="/assets/logo.svg" alt="Robotvergelijk" height="34" width="87">
    </a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
      <svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <nav class="main-nav" aria-label="Hoofdmenu">
      {{{nav}}}
    </nav>
  </div>
</header>

<main id="hoofd">
{{{body}}}
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-disclosure">
      <strong>Hoe wij geld verdienen</strong>
      <p>{{site.disclosure}}</p>
    </div>
    <div class="footer-grid">
      <div class="footer-merk">
        <img class="logo-mark" src="/assets/logo.svg" alt="Robotvergelijk" height="30" width="77">
        <p>{{site.beschrijving}}</p>
      </div>
      {{{footer}}}
    </div>
    <div class="footer-bottom">
      <span>© {{jaar}} {{site.domein}}</span>
      <span>Onafhankelijk · Geen betaalmuur · Nederlandstalig</span>
    </div>
  </div>
</footer>

<script src="/assets/wizard-data.js" defer></script>
<script src="/assets/site.js" defer></script>
</body>
</html>
